name: Public demo checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m unittest discover -s tests -p demo_data_test.py
      - run: python tools/check_public_demo.py
      - run: node --check demo/app.js
      - run: node --check tools/serve_demo.mjs
      - run: python tools/generate_demo_data.py
      - run: git diff --exit-code -- demo/data.js data/shop_report.json
