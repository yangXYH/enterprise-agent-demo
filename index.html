<h1>启动完整企业 AI 工作台</h1>
<p>项目运行原来的 Vue 界面、FastAPI 后端和 MySQL 数据库。启动时自动生成虚构测试数据，保留原业务功能与权限。</p>
<p>安装 Docker Desktop 后，在项目目录执行 <code>docker compose up --build</code>。Windows 也可双击 <code>start-demo.cmd</code>。</p>
<p>服务启动后：<a href="http://127.0.0.1:4173">打开完整应用</a>，登录 <code>demo_admin</code> / <code>Demo@2026</code>。</p>
<p>本文件仅为启动说明。详细环境配置与模块说明见仓库 README.md。</p></html>
