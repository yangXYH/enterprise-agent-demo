<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/demo-logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Enterprise Command</title>
    <!--
      Sync script: runs BEFORE Vue/CSS loads to prevent FOUC.
      Default = LIGHT. Dark only if localStorage key is exactly 'dark'.
      Must be blocking (< 200 bytes, no deps) to execute before render.
    -->
    <script>
      (function() {
        var ls = null;
        try { ls = localStorage.getItem('user_theme'); } catch(e) {}
        // Only apply dark if explicitly saved as 'dark'; otherwise default to light
        if (ls === 'dark') {
          document.documentElement.classList.add('dark-theme');
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <script type="module" crossorigin src="/assets/main-kB8KG2gK.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/main-BT9TBkYf.css">
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
