<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>电商中台看板</title>
<script>
// Apply the saved shell theme before the dashboard is painted, then follow later shell changes.
(function(){
  function applyTheme(theme){
    if(theme==='dark'||theme==='light') document.documentElement.classList.toggle('dark-theme',theme==='dark');
  }
  try{applyTheme(localStorage.getItem('user_theme'));}catch(_e){}
  window.addEventListener('message',function(event){
    const data=event.data;
    if(event.source!==window.parent||!data||data.type!=='ecom-theme') return;
    if(data.theme!=='dark'&&data.theme!=='light') return;
    applyTheme(data.theme);
    try{localStorage.setItem('user_theme',data.theme);}catch(_e){}
  });
})();
</script>
<style>
/* ===== 电商中台看板 · 白色主题 + 蓝紫主色 ===== */
:root{
  --brand:#4f6ef7; --brand-strong:#3b5bdb; --brand-weak:#eef1fe;
  --bg:#f5f6f9; --card:#ffffff; --border:#e6e8ef; --border-s:#d5d9e2;
  --text:#1f2430; --text2:#5b6472; --text3:#98a0ae;
  --blue:#4f6ef7;--blue-bg:#eef1fe;--green:#22a06b;--green-bg:#e6f6ef;
  --orange:#e8842c;--orange-bg:#fdf1e4;--purple:#8b5cf6;--purple-bg:#f1ecfe;
  --gray:#868e9c;--gray-bg:#eef0f4;--red:#e5484d;--red-bg:#fdebec;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#d0d4de;border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#b8bdca}
.section-title{font-size:15px;font-weight:600;margin:0}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow)}

/* ==== 布局 ==== */
.layout{display:flex;height:100%}
.sidebar{width:240px;flex-shrink:0;background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;height:100%;overflow:hidden}
.logo{height:56px;flex-shrink:0;display:flex;align-items:center;gap:10px;padding:0 18px;border-bottom:1px solid var(--border)}
.logo-mark{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--brand),var(--purple));color:#fff;display:flex;align-items:center;justify-content:center}
.logo-text{font-size:16px;font-weight:700}
.fold-btn{margin-left:auto;width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;border:none;background:transparent;color:var(--text2);border-radius:6px;flex-shrink:0}
.fold-btn:hover{background:var(--bg);color:var(--brand)}
/* 收起态：窄条，只留图标 */
.sidebar.fold{width:56px;transition:width .2s ease}
.sidebar.fold .logo{padding:0 12px}
.sidebar.fold .logo-text{display:none}
.sidebar.fold .logo-mark{margin-right:0}
.sidebar.fold .fold-btn{display:inline-flex;justify-content:center}
.sidebar.fold .menu{padding:10px 6px}
.sidebar.fold .menu-item{justify-content:center;padding:9px 4px}
.sidebar.fold .menu-label{display:none}
.sidebar.fold .menu-group-title{display:none}
.sidebar.fold .menu-children{display:none}
.sidebar.fold .chev{display:none}
.sidebar.fold .sidebar-foot{padding:12px 6px}
.sidebar.fold .foot-chip{justify-content:center;padding:7px 2px}
.sidebar.fold .foot-chip{font-size:0}
.sidebar.fold .foot-chip svg{width:15px;height:15px}
.menu{flex:1;overflow-y:auto;padding:10px}
.menu-item{display:flex;align-items:center;gap:10px;padding:9px 10px;margin-bottom:2px;border-radius:8px;cursor:pointer;color:var(--text2);font-size:13.5px;user-select:none}
.menu-item:hover{background:var(--bg);color:var(--text)}
.menu-item.active{background:var(--brand-weak);color:var(--brand-strong);font-weight:600}
.group-head{justify-content:flex-start}
.group-head.child-active{color:var(--text);font-weight:600}
.menu-group-title{margin:12px 10px 4px;font-size:11px;font-weight:700;color:var(--text3);letter-spacing:.06em;text-transform:uppercase;user-select:none}
.menu-group-title:first-of-type{margin-top:2px}
.chev{margin-left:auto;display:flex;color:var(--text3)}
.chev-icon{display:block}
.menu-children{margin-left:12px;border-left:1px solid var(--border);padding-left:8px}
.menu-group-title + .menu-item{margin-top:2px}
.menu-item.child{font-size:13px}
.menu-icon{display:flex}
.menu-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sidebar-foot{padding:12px 16px;border-top:1px solid var(--border);flex-shrink:0}
.foot-chip{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text3);background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:7px 10px}

/* ==== 主区 ==== */
.main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg)}
.topbar{height:56px;flex-shrink:0;background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px}
/* 演示页面顶栏：淡色弱化提示 */
.topbar-dev{background:rgba(148,163,184,0.10)}
.topbar-dev .breadcrumb{color:var(--text3)}
.breadcrumb{color:var(--text3);font-size:13px}
.breadcrumb .crumb{color:var(--brand);font-weight:600;text-decoration:none}
.breadcrumb .crumb:hover{color:var(--brand-strong);text-decoration:underline}
.breadcrumb .crumb:last-child{color:var(--text);cursor:default}
.breadcrumb .crumb:last-child:hover{text-decoration:none;color:var(--text)}
.topbar-right{display:flex;align-items:center;gap:8px}
.icon-btn{width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:8px;border:none;background:transparent;color:var(--text2)}
.icon-btn:hover{background:var(--bg);color:var(--text)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;margin-left:6px}
.content{flex:1;overflow-y:auto;padding:20px 24px 40px}
.page{display:flex;flex-direction:column;gap:16px}
.block{width:100%}

/* ==== 快捷入口 ==== */
.links-card{padding:16px}
.links-title{margin-bottom:14px}
.links{display:flex;flex-wrap:wrap;gap:12px}
.link{display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);border:1px solid var(--border);border-radius:10px;cursor:pointer;color:var(--text2);transition:all .15s}
.link:hover{border-color:var(--brand);color:var(--brand);background:var(--brand-weak);transform:translateY(-1px)}
.links.top .link{width:108px;height:84px;gap:8px}
.links.frequent .link{width:96px;height:70px;gap:6px}
.link-icon{display:flex;color:var(--brand)}
.link-text{font-size:12.5px;font-weight:500}

/* 首页 · 知识管理：铺满内容区，并强化“知识库入口”语义 */
.knowledge-card{position:relative;overflow:hidden;padding:18px;background:linear-gradient(135deg,#fff 0%,#fbfcff 62%,#f4f7ff 100%);border-color:#dfe5f1;box-shadow:0 4px 14px rgba(30,64,175,.055)}
.knowledge-card::after{content:"";position:absolute;right:-72px;top:-92px;width:210px;height:210px;border-radius:50%;background:radial-gradient(circle,rgba(79,110,247,.09) 0%,rgba(79,110,247,0) 70%);pointer-events:none}
.knowledge-head{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:15px}
.knowledge-heading{display:flex;align-items:center;gap:11px;min-width:0}
.knowledge-title-icon{width:34px;height:34px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;border-radius:10px;color:var(--brand);background:var(--brand-weak);box-shadow:inset 0 0 0 1px rgba(79,110,247,.08)}
.knowledge-title-copy{min-width:0}
.knowledge-card .links-title{margin:0;color:#182230;font-size:15px;line-height:22px}
.knowledge-subtitle{margin:1px 0 0;color:var(--text3);font-size:12px;line-height:18px}
.knowledge-action{position:relative;z-index:1;display:inline-flex;align-items:center;gap:6px;flex:0 0 auto;height:32px;padding:0 12px;border:1px solid #dce3ff;border-radius:8px;background:rgba(255,255,255,.82);color:var(--brand-strong);font-size:12.5px;font-weight:600;transition:all .18s ease}
.knowledge-action:hover{border-color:var(--brand);background:var(--brand);color:#fff;box-shadow:0 5px 12px rgba(79,110,247,.2);transform:translateY(-1px)}
.knowledge-action:focus-visible,.knowledge-link:focus-visible{outline:2px solid rgba(79,110,247,.35);outline-offset:2px}
.knowledge-links{position:relative;z-index:1;display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:10px}
.knowledge-link{--kb-color:var(--brand);--kb-bg:var(--brand-weak);position:relative;min-width:0;height:78px;display:grid;grid-template-columns:36px minmax(0,1fr);align-items:center;gap:9px;padding:0 10px;border:1px solid #e4e8f0;border-radius:10px;background:rgba(255,255,255,.86);color:var(--text);text-align:left;font-family:inherit;cursor:pointer;box-shadow:0 1px 2px rgba(16,24,40,.025);transition:border-color .18s ease,box-shadow .18s ease,transform .18s ease,background .18s ease}
.knowledge-link:hover{border-color:color-mix(in srgb,var(--kb-color) 42%,#fff);background:#fff;box-shadow:0 7px 18px rgba(30,64,175,.09);transform:translateY(-2px)}
.knowledge-link-icon{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:10px;color:var(--kb-color);background:var(--kb-bg);transition:transform .18s ease}
.knowledge-link:hover .knowledge-link-icon{transform:scale(1.05)}
.knowledge-link-copy{min-width:0;display:flex;flex-direction:column;gap:3px}
.knowledge-link-name{overflow:hidden;color:#344054;font-size:12.5px;font-weight:600;line-height:18px;text-overflow:ellipsis;white-space:nowrap}
.knowledge-link-meta{color:#98a2b3;font-size:11px;line-height:15px}
.knowledge-link-arrow{position:absolute;right:6px;top:50%;display:flex;color:var(--kb-color);opacity:0;transform:translate(-2px,-50%);transition:opacity .18s ease,transform .18s ease}
.knowledge-link:hover .knowledge-link-arrow{opacity:1;transform:translate(0,-50%)}

/* ==== 经营首页：真实经营摘要与正式模块导航 ==== */
.home-intro{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;padding:4px 2px 0}
.home-eyebrow{display:block;margin-bottom:5px;color:#0d7f74;font-size:11px;font-weight:700;letter-spacing:.1em}
.home-intro h1{margin:0;color:#17313a;font-size:25px;line-height:1.3}
.home-intro p{margin:6px 0 0;color:var(--text2);font-size:13px;line-height:1.6}
.home-refresh{display:inline-flex;align-items:center;gap:6px;flex:none;height:34px;padding:0 12px;border:1px solid var(--border-s);border-radius:8px;background:#fff;color:var(--text2);font-size:12.5px}
.home-refresh:hover{border-color:#0d8978;color:#0d8978}
.home-panel{padding:20px}
.home-section-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:17px}
.home-section-head h2{margin:0;color:#18313a;font-size:17px}
.home-section-head p{margin:5px 0 0;color:var(--text2);font-size:12px;line-height:1.6}
.home-period{flex:none;border:1px solid #d9e9e5;border-radius:20px;background:#f2faf8;padding:6px 11px;color:#187b70;font-size:12px}
.home-metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.home-metric{min-width:0;border:1px solid #e3e9ea;border-radius:10px;background:#fbfdfd;padding:16px 18px}
.home-metric:first-child{background:linear-gradient(135deg,#0d514e,#138b7a);border-color:#0d786c;color:#fff}
.home-metric-label{display:block;color:#667783;font-size:12px}
.home-metric:first-child .home-metric-label,.home-metric:first-child .home-metric-note{color:#d4efea}
.home-metric-value{display:block;margin:9px 0 7px;color:#19323b;font-size:25px;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.home-metric:first-child .home-metric-value{color:#fff}
.home-metric-note{display:block;color:#87939c;font-size:11px;line-height:1.45}
.home-data-note{display:flex;align-items:center;gap:9px;margin-top:14px;padding:10px 12px;border-radius:8px;background:#f2f8f7;color:#55726e;font-size:12px;line-height:1.5}
.home-data-note.warn{background:#fff7e9;color:#9b5a13}
.home-data-note.error{background:#fff4f2;color:#aa4d42}
.home-empty{padding:26px 15px;border:1px dashed #d8e4e2;border-radius:10px;background:#fbfdfd;color:#617680;font-size:13px;line-height:1.7;text-align:center}
.home-empty strong{display:block;margin-bottom:4px;color:#213c44;font-size:15px}
.home-action{display:inline-flex;align-items:center;gap:5px;margin-top:12px;border:0;background:transparent;color:#0d8978;font-size:12.5px;font-weight:600}
.home-action:hover{text-decoration:underline}
.home-entry-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.home-entry{display:flex;align-items:flex-start;gap:11px;min-width:0;min-height:95px;padding:16px;border:1px solid #e1e8e9;border-radius:10px;background:#fff;text-align:left;color:var(--text);transition:border-color .15s,box-shadow .15s,transform .15s}
.home-entry:hover{border-color:#6db6aa;box-shadow:0 7px 18px rgba(12,89,77,.09);transform:translateY(-2px)}
.home-entry:focus-visible,.home-refresh:focus-visible,.home-action:focus-visible{outline:2px solid #0d8978;outline-offset:2px}
.home-entry-icon{display:inline-flex;align-items:center;justify-content:center;width:35px;height:35px;flex:none;border-radius:9px;background:#e9f6f3;color:#0d8978}
.home-entry-copy{display:flex;flex-direction:column;min-width:0;gap:4px}
.home-entry-copy strong{font-size:13.5px;line-height:1.35}
.home-entry-copy small{color:#7e8e96;font-size:11.5px;line-height:1.45}
.home-knowledge{padding:18px}
.home-knowledge .knowledge-head{margin-bottom:13px}
@media(max-width:1180px){.home-metrics,.home-entry-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){.home-intro,.home-section-head{flex-wrap:wrap}.home-metrics,.home-entry-grid{grid-template-columns:1fr}.home-panel{padding:16px}.home-period{flex:none}}

/* ==== KPI ==== */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.kpi-card{padding:16px 18px}
.kpi-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.kpi-label{color:var(--text2);font-size:13px}
.kpi-color{width:8px;height:8px;border-radius:50%}
.c-blue{background:var(--blue)}.c-green{background:var(--green)}.c-orange{background:var(--orange)}.c-purple{background:var(--purple)}.c-gray{background:var(--gray)}
.kpi-value{font-size:28px;font-weight:700;letter-spacing:-.5px;line-height:1.1}
.kpi-unit{font-size:13px;font-weight:400;color:var(--text2);margin-left:4px}
.kpi-hint{display:flex;align-items:center;gap:4px;margin-top:10px;font-size:12px;color:var(--text3)}
.kpi-hint.up{color:var(--green)}
.kpi-hint.down{color:var(--orange)}

/* ==== 表格 ==== */
.table-card{overflow:hidden}
.table-head{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.head-title{display:flex;align-items:center;gap:18px}
.tabs{display:flex;gap:4px}
.tab{border:none;background:transparent;padding:6px 14px;border-radius:6px;font-size:13.5px;color:var(--text2)}
.tab:hover{background:var(--bg);color:var(--text)}
.tab.active{color:var(--brand-strong);font-weight:600;background:var(--brand-weak)}
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tool.search{display:flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:6px;padding:0 9px;height:32px;color:var(--text3)}
.tool.search input{border:none;outline:none;height:100%;width:120px;font-size:13px;background:transparent}
.tool-btn{display:flex;align-items:center;gap:5px;height:32px;padding:0 10px;border:1px solid var(--border);background:#fff;border-radius:6px;color:var(--text2);font-size:12.5px}
.tool-btn:hover{border-color:var(--brand);color:var(--brand)}
.tool-btn.on{background:var(--brand-weak);border-color:var(--brand);color:var(--brand)}
.filter-panel{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--bg)}
.fp-label{color:var(--text2);font-size:12.5px;margin-right:4px}
.fp-chip{border:1px solid var(--border);background:#fff;padding:3px 10px;border-radius:20px;font-size:12px;color:var(--text2)}
.fp-chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.fp-clear{border:none;background:transparent;color:var(--brand);font-size:12.5px}
.table-wrap{overflow-x:auto;min-height:200px}
table{width:100%;border-collapse:collapse;white-space:nowrap}
th{text-align:left;font-weight:600;font-size:12.5px;color:var(--text2);background:#fafafc;padding:10px 14px;border-bottom:1px solid var(--border)}
.th-sort{display:inline-flex;align-items:center;gap:4px;cursor:pointer}
.th-sort:hover{color:var(--brand)}
.sort-ic{color:var(--brand)}
td{padding:10px 14px;border-bottom:1px solid var(--border);font-size:13px;color:var(--text)}
table.compact td,table.compact th{padding-top:6px;padding-bottom:6px}
tr:hover td{background:#f8f9fc}
.cell.num{font-variant-numeric:tabular-nums}
.user-cell{display:flex;align-items:center;gap:8px}
.thumb{display:inline-block;width:40px;height:40px;border-radius:6px;border:1px solid var(--border)}
.ck{width:15px;height:15px;accent-color:var(--brand)}
.loading{padding:40px;color:var(--text3);text-align:center}
.err-box{padding:30px;color:var(--red);text-align:center}

/* ==== Tag / Avatar ==== */
.tag{display:inline-flex;align-items:center;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:500;white-space:nowrap}
.t-blue{background:var(--blue-bg);color:var(--blue)}.t-green{background:var(--green-bg);color:var(--green)}
.t-orange{background:var(--orange-bg);color:var(--orange)}.t-purple{background:var(--purple-bg);color:var(--purple)}
.t-gray{background:var(--gray-bg);color:var(--text2)}.t-red{background:var(--red-bg);color:var(--red)}
.avatar{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;color:#fff;font-weight:600;flex-shrink:0}

/* ==== 分页 ==== */
.pagination{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;padding:12px 16px;border-top:1px solid var(--border)}
.total{color:var(--text2);font-size:13px}
.pages{display:flex;align-items:center;gap:4px}
.pg-btn,.pg-num{min-width:30px;height:30px;padding:0 6px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--border);background:#fff;color:var(--text2);border-radius:6px;font-size:13px}
.pg-btn:hover:not(:disabled),.pg-num:hover{border-color:var(--brand);color:var(--brand)}
.pg-btn:disabled{opacity:.4;cursor:not-allowed}
.pg-num.active{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.page-right{display:flex;align-items:center;gap:16px}
.size-label,.jump{display:flex;align-items:center;gap:6px;color:var(--text2);font-size:13px}
select,.jump input{height:30px;border:1px solid var(--border);border-radius:6px;padding:0 8px;font-size:13px;background:#fff;color:var(--text)}
.jump input{width:52px}

/* ==== 空状态 ==== */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:56px 20px;color:var(--text3)}
.empty-icon{opacity:.5;margin-bottom:12px}
.empty-text{margin:0;font-size:13px}

/* ==== 知识管理页 ==== */
.kb-card{overflow:hidden}
.kb-head{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.kb-op{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.kb-libs{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px;padding:12px 16px;border-bottom:1px solid var(--border);background:#fafafc}
.kb-libs-tabs{display:flex;flex-wrap:wrap;gap:6px;flex:1;min-width:0}
.kb-lib{border:1px solid var(--border);background:#fff;padding:5px 12px;border-radius:20px;font-size:12.5px;color:var(--text2);cursor:pointer}
.kb-lib:hover{border-color:var(--brand);color:var(--brand)}
.kb-lib.active{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.kb-ai-qa-link{flex-shrink:0;display:inline-flex;align-items:center;gap:4px;margin-left:8px;padding:5px 12px;border:1px solid var(--brand);background:var(--brand-weak);color:var(--brand-strong);border-radius:20px;font-size:12.5px;font-weight:600;cursor:pointer;transition:all .15s ease}
.kb-ai-qa-link:hover{background:var(--brand);color:#fff;border-color:var(--brand)}
.kb-toolbar{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.kb-crumb{color:var(--text2);font-size:13px}
.kb-list{min-height:200px}
.kb-row{display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid var(--border);cursor:pointer}
.kb-row:hover{background:#f8f9fc}
.kb-ic{color:var(--brand);display:flex}
.kb-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
.kb-meta{color:var(--text3);font-size:12px;flex-shrink:0}
.kb-actions{display:flex;gap:6px;flex-shrink:0}
.kb-btn{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--border);background:#fff;border-radius:6px;padding:5px 10px;font-size:12.5px;color:var(--text2);cursor:pointer;text-decoration:none}
.kb-btn:hover{border-color:var(--brand);color:var(--brand)}
.kb-btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.kb-btn.primary:hover{background:var(--brand-strong)}
.kb-btn.danger{color:var(--red);border-color:var(--red-bg)}
.kb-btn.danger:hover{background:var(--red-bg)}
.kb-empty{padding:40px;color:var(--text3);text-align:center}

/* 新建文件夹弹层 */
.kb-create-mask{position:fixed;inset:0;z-index:220;background:rgba(15,23,42,.36);backdrop-filter:blur(2px);animation:kbMaskIn .16s ease}
.kb-create-dialog{position:fixed;left:50%;top:50%;z-index:221;width:min(92vw,430px);transform:translate(-50%,-50%);overflow:hidden;border:1px solid rgba(226,232,240,.9);border-radius:14px;background:#fff;box-shadow:0 24px 60px rgba(15,23,42,.22);animation:kbDialogIn .2s ease}
@keyframes kbMaskIn{from{opacity:0}to{opacity:1}}
@keyframes kbDialogIn{from{opacity:0;transform:translate(-50%,-47%) scale(.98)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.kb-create-head{display:flex;align-items:flex-start;gap:12px;padding:20px 20px 14px}
.kb-create-icon{width:40px;height:40px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;border-radius:11px;background:var(--brand-weak);color:var(--brand)}
.kb-create-title-wrap{min-width:0;flex:1}
.kb-create-title{margin:0;color:#182230;font-size:16px;font-weight:650;line-height:22px}
.kb-create-subtitle{margin:4px 0 0;color:var(--text3);font-size:12px;line-height:18px}
.kb-create-x{width:30px;height:30px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;margin:-4px -4px 0 0;border:0;border-radius:7px;background:transparent;color:var(--text3);font-size:20px;line-height:1;transition:background .15s,color .15s}
.kb-create-x:hover{background:#f3f4f7;color:var(--text)}
.kb-create-body{padding:4px 20px 20px}
.kb-create-location{display:flex;align-items:center;gap:7px;min-width:0;margin-bottom:15px;padding:9px 11px;border-radius:8px;background:#f7f8fc;color:var(--text2);font-size:12px}
.kb-create-location svg{flex:0 0 auto;color:var(--brand)}
.kb-create-location span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kb-create-label{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px;color:#344054;font-size:13px;font-weight:600}
.kb-create-count{color:var(--text3);font-size:11px;font-weight:400}
.kb-create-input{width:100%;height:40px;border:1px solid #d8dde7;border-radius:8px;padding:0 12px;background:#fff;color:var(--text);font-family:inherit;font-size:13.5px;outline:none;transition:border-color .15s,box-shadow .15s}
.kb-create-input::placeholder{color:#b0b7c3}
.kb-create-input:hover{border-color:#b8c1d1}
.kb-create-input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(79,110,247,.12)}
.kb-create-input.invalid{border-color:var(--red);box-shadow:0 0 0 3px rgba(229,72,77,.1)}
.kb-create-help{margin:7px 0 0;color:var(--text3);font-size:11.5px;line-height:17px}
.kb-create-error{display:flex;align-items:center;gap:5px;min-height:18px;margin:5px 0 0;color:var(--red);font-size:11.5px;line-height:18px}
.kb-create-error:empty{display:none}
.kb-create-foot{display:flex;align-items:center;justify-content:flex-end;gap:9px;padding:14px 20px;border-top:1px solid #edf0f5;background:#fafbfd}
.kb-create-foot .kb-btn{min-width:72px;height:34px;justify-content:center}
.kb-create-foot .kb-btn:disabled{opacity:.6;cursor:not-allowed}

/* ==== 预览弹层 ==== */
.pv-mask{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:200}
.pv-drawer{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(94vw,1500px);height:92vh;max-height:92vh;background:var(--bg-card);z-index:201;display:flex;flex-direction:column;border-radius:12px;box-shadow:0 24px 70px rgba(15,23,42,.38);overflow:hidden;animation:pvIn .2s ease}
@keyframes pvIn{from{opacity:0;transform:translate(-50%,-50%) scale(.96)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.pv-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--border);flex-shrink:0}
.pv-title{font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pv-body{flex:1;overflow:auto;padding:18px;min-height:0}
.pv-img{display:flex;align-items:center;justify-content:center;min-height:60vh}
.pv-img img{max-width:100%;max-height:calc(92vh - 130px);border-radius:6px;box-shadow:var(--shadow-md)}
.pv-iframe{height:calc(92vh - 96px)}
.pv-iframe iframe{width:100%;height:100%;border:1px solid var(--border);border-radius:6px}
.pv-text{margin:0;white-space:pre-wrap;word-break:break-word;font-size:13px;line-height:1.7;color:var(--text);background:var(--bg);padding:16px;border-radius:8px}
.pv-table-wrap{overflow:auto}
.pv-table{width:100%;border-collapse:collapse;font-size:13px}
.pv-table th,.pv-table td{border:1px solid var(--border);padding:8px 12px;text-align:left}
.pv-table th{background:#fafafc;font-weight:600;color:var(--text2)}
.pv-table .muted{color:var(--text3);text-align:center}
.pv-err{padding:40px;color:var(--red);text-align:center}
.pv-html{font-size:13px;line-height:1.7;color:var(--text)}
.pv-html .pv-xlsx,.pv-html .pv-doc{overflow:auto}
.pv-html table{width:100%;border-collapse:collapse}
.pv-html th,.pv-html td{border:1px solid #e6e8ef;padding:8px 12px;text-align:left}
.pv-html th{background:#fafafc;font-weight:600;color:var(--text2)}
.pv-html .pv-h1{font-size:20px;font-weight:700;color:var(--text);margin:8px 0 10px}
.pv-html .pv-h2{font-size:17px;font-weight:600;color:var(--text);margin:8px 0 8px}
.pv-html .pv-h3{font-size:15px;font-weight:600;color:var(--text2);margin:6px 0 6px}
.pv-html .pv-p{margin:4px 0}
.pv-html .pv-ul{margin:4px 0;padding-left:22px}
.pv-html .pv-li{margin:2px 0}
.pv-html .pv-note{color:var(--text3);text-align:center;padding:20px}

/* ==== AI 知识问答（iframe 内嵌版）==== */
.kqa-page{display:flex;flex-direction:column;gap:0;padding:0!important;min-height:0;height:100%;max-height:100%;overflow:hidden}
.kqa-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border);background:linear-gradient(135deg,#4f6ef7,#8b5cf6);color:#fff;border-radius:10px 10px 0 0}
.kqa-head-title{font-size:15px;font-weight:600}
.kqa-btn{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.18);color:#fff;border-radius:6px;padding:5px 12px;font-size:12.5px;cursor:pointer}
.kqa-btn:hover{background:rgba(255,255,255,.32)}
.kqa-controls{padding:12px 18px;border-bottom:1px solid #eef0f4;background:#fafbfd}
.kqa-label{display:block;font-size:12px;color:var(--text2);margin-bottom:4px}
.kqa-select{position:relative;display:flex;align-items:center;justify-content:space-between;width:100%;max-width:480px;height:32px;border:1px solid var(--border);border-radius:6px;padding:0 10px;font-size:13px;background:#fff;color:var(--text);cursor:pointer;user-select:none}
.kqa-select.open{border-color:var(--brand);box-shadow:0 0 0 2px rgba(79,110,247,.18)}
.kqa-select:hover{border-color:var(--brand)}
.kqa-select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 2px rgba(79,110,247,.18)}
.kqa-select-label{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kqa-select-caret{color:var(--text3);font-size:12px;margin-left:6px;transition:transform .15s ease}
.kqa-select.open .kqa-select-caret{transform:rotate(180deg);color:var(--brand)}
.kqa-dd{position:absolute;left:0;right:0;top:36px;z-index:50;background:#fff;border:1px solid var(--border);border-radius:8px;box-shadow:0 8px 24px rgba(15,23,42,.14);max-height:280px;overflow-y:auto}
.kqa-dd[hidden]{display:none}
.kqa-dd-list{display:flex;flex-direction:column;padding:4px 0}
.kqa-dd-item{padding:8px 12px;font-size:13px;color:var(--text);cursor:pointer;line-height:1.4}
.kqa-dd-item:hover{background:#f0f2f8;color:var(--brand-strong)}
.kqa-dd-item.active{background:var(--brand-weak);color:var(--brand-strong);font-weight:600}
.kqa-hint{margin:6px 0 0;font-size:11px;color:var(--text3)}
.kqa-messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;background:#f7f8fb;min-height:0}
.kqa-empty{margin:auto;text-align:center;color:var(--text2)}
.kqa-empty-title{font-size:15px;font-weight:600;margin:0 0 8px;color:var(--text)}
.kqa-empty-tip{font-size:12px;color:var(--text3);margin:0}
.kqa-msg{display:flex;flex-direction:column;max-width:92%;min-width:0;width:fit-content}
.kqa-msg.is-user{align-self:flex-end}
.kqa-msg.is-assistant{align-self:flex-start}
.kqa-bubble{padding:10px 14px;border-radius:10px;font-size:13px;line-height:1.6;white-space:pre-wrap;word-break:break-word;overflow-wrap:break-word;word-wrap:break-word;max-width:100%;min-width:0;box-shadow:0 1px 2px rgba(15,23,42,.05)}
.kqa-bubble-text{overflow-wrap:break-word;word-wrap:break-word;word-break:break-word;min-width:0}
.kqa-msg.is-user .kqa-bubble{background:linear-gradient(135deg,#4f6ef7,#6f86ff);color:#fff;border-bottom-right-radius:2px}
.kqa-msg.is-assistant .kqa-bubble{background:#fff;color:var(--text);border:1px solid var(--border);border-bottom-left-radius:2px}
.kqa-model{margin-top:6px;font-size:11px;color:var(--text3)}
.kqa-sources{margin-top:10px;padding-top:8px;border-top:1px dashed #e6e8ef}
.kqa-sources-title{font-size:12px;font-weight:600;color:var(--text2);margin-bottom:6px}
.kqa-sources ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
.kqa-source{background:#f7f8fb;border:1px solid #eef0f4;border-radius:6px;padding:6px 8px}
.kqa-source-name{font-weight:600;color:var(--brand);font-size:12.5px}
.kqa-source-meta{margin-left:6px;font-size:11px;color:var(--text3)}
.kqa-source-snippet{margin-top:4px;font-size:11.5px;color:var(--text2);line-height:1.5;white-space:pre-wrap}
.kqa-pending{display:inline-flex;align-items:center;gap:4px;color:var(--text2);font-size:12.5px}
.kqa-dot{width:6px;height:6px;border-radius:50%;background:var(--brand);display:inline-block;animation:kqaPulse 1s infinite ease-in-out}
.kqa-dot:nth-child(2){animation-delay:.15s}
.kqa-dot:nth-child(3){animation-delay:.3s}
.kqa-pending-text{margin-left:6px}
@keyframes kqaPulse{0%,80%,100%{opacity:.3}40%{opacity:1}}
.kqa-foot{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--border);background:#fff;border-radius:0 0 10px 10px}
.kqa-textarea{flex:1;resize:none;border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-family:inherit;font-size:13px;line-height:1.5;color:var(--text);outline:none;min-height:40px;max-height:140px}
.kqa-textarea:focus{border-color:var(--brand);box-shadow:0 0 0 2px rgba(79,110,247,.18)}
.kqa-send{align-self:flex-end;height:40px;padding:0 18px;border:none;border-radius:8px;background:linear-gradient(135deg,#4f6ef7,#6f86ff);color:#fff;font-size:13px;font-weight:600;cursor:pointer;transition:opacity .15s ease}
.kqa-send:disabled{opacity:.45;cursor:not-allowed}

@media (max-width:900px){
  .sidebar{position:fixed;z-index:99;box-shadow:var(--shadow);transform:translateX(-100%);transition:transform .22s}
  .sidebar.open{transform:translateX(0)}
  .topbar{padding:0 16px}
  .content{padding:16px}
  .knowledge-head{align-items:flex-start}
  .knowledge-action{padding:0 9px}
  .knowledge-links{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (min-width:901px) and (max-width:1450px){
  .knowledge-links{grid-template-columns:repeat(5,minmax(0,1fr))}
}
@media (max-width:560px){
  .knowledge-card{padding:15px}
  .knowledge-head{position:relative;display:block}
  .knowledge-heading{padding-right:42px}
  .knowledge-subtitle{white-space:normal}
  .knowledge-action{position:absolute;right:0;top:1px;width:32px;padding:0;justify-content:center}
  .knowledge-action span,.knowledge-action svg:last-child{display:none}
  .knowledge-links{grid-template-columns:1fr}
  .kb-create-dialog{width:calc(100vw - 28px)}
  .kb-create-head{padding:17px 16px 12px}
  .kb-create-body{padding:4px 16px 17px}
  .kb-create-foot{padding:12px 16px}
}

/* The embedded dashboard follows the parent shell's light/dark theme. */
html.dark-theme{
  color-scheme:dark;
  --brand:#91a8ff;--brand-strong:#adc0ff;--brand-weak:#29365b;
  --bg:#101827;--card:#1a2638;--border:#34445a;--border-s:#465873;
  --text:#edf3fb;--text2:#c0cddd;--text3:#96a8bc;
  --blue:#98adff;--blue-bg:#29365b;--green:#65d3a7;--green-bg:#1b423c;
  --orange:#ffb46b;--orange-bg:#493523;--purple:#c0a1ff;--purple-bg:#392d57;
  --gray:#acb9ca;--gray-bg:#304052;--red:#ff8588;--red-bg:#4d2b34;
  --bg-card:#1a2638;--shadow-md:0 14px 36px rgba(0,0,0,.35);
  --shadow:0 1px 3px rgba(0,0,0,.2);
}
html.dark-theme ::-webkit-scrollbar-thumb{background:#455771}
html.dark-theme ::-webkit-scrollbar-thumb:hover{background:#61738e}
html.dark-theme input::placeholder,html.dark-theme textarea::placeholder{color:var(--text3)}
html.dark-theme .topbar-dev{background:#202d40}

/* Home and knowledge entry cards. */
html.dark-theme .knowledge-card{background:linear-gradient(135deg,#1c2a40 0%,#1a2638 65%,#202b48 100%);border-color:var(--border);box-shadow:var(--shadow)}
html.dark-theme .knowledge-card::after{background:radial-gradient(circle,rgba(145,168,255,.12),transparent 70%)}
html.dark-theme .knowledge-card .links-title,html.dark-theme .knowledge-link-name{color:var(--text)}
html.dark-theme .knowledge-action,html.dark-theme .knowledge-link{background:#222f43;border-color:var(--border);color:var(--text)}
html.dark-theme .knowledge-action{color:var(--brand-strong)}
html.dark-theme .knowledge-action:hover{background:var(--brand-weak);border-color:var(--brand);color:var(--text)}
html.dark-theme .knowledge-link:hover{background:#2a3950;border-color:var(--brand);box-shadow:0 7px 18px rgba(0,0,0,.2)}
html.dark-theme .knowledge-link-icon{background:color-mix(in srgb,var(--kb-color) 24%,#1a2638);color:color-mix(in srgb,var(--kb-color) 55%,#fff)}
html.dark-theme .knowledge-link-meta{color:var(--text3)}
html.dark-theme .home-intro h1,html.dark-theme .home-section-head h2,html.dark-theme .home-metric-value,html.dark-theme .home-empty strong{color:var(--text)}
html.dark-theme .home-eyebrow,html.dark-theme .home-action{color:var(--green)}
html.dark-theme .home-refresh,html.dark-theme .home-entry{background:var(--card);border-color:var(--border);color:var(--text)}
html.dark-theme .home-refresh:hover,html.dark-theme .home-entry:hover{border-color:var(--green);color:var(--green)}
html.dark-theme .home-period{background:#203e3c;border-color:#36675e;color:#a2e8ce}
html.dark-theme .home-metric,html.dark-theme .home-empty{background:#202e3e;border-color:var(--border)}
html.dark-theme .home-metric:first-child{background:linear-gradient(135deg,#115a53,#117e70);border-color:#288c79}
html.dark-theme .home-metric:first-child .home-metric-value{color:#fff}
html.dark-theme .home-metric-label,html.dark-theme .home-metric-note,html.dark-theme .home-empty,html.dark-theme .home-entry-copy small{color:var(--text2)}
html.dark-theme .home-metric:first-child .home-metric-label,html.dark-theme .home-metric:first-child .home-metric-note{color:#d7f3eb}
html.dark-theme .home-data-note{background:#203e3c;color:#b9dfd4}
html.dark-theme .home-data-note.warn{background:#443621;color:#ffcc88}
html.dark-theme .home-data-note.error{background:#492b31;color:#ffaaaa}
html.dark-theme .home-entry-icon{background:#20433d;color:var(--green)}

/* Data tables and their controls. */
html.dark-theme .tool.search input,html.dark-theme .kqa-textarea{color:var(--text)}
html.dark-theme .tool-btn,html.dark-theme .fp-chip,html.dark-theme .pg-btn,html.dark-theme .pg-num,html.dark-theme select,html.dark-theme .jump input{background:var(--card);border-color:var(--border);color:var(--text2)}
html.dark-theme .tool-btn.on{background:var(--brand-weak);border-color:var(--brand);color:var(--brand-strong)}
html.dark-theme .fp-chip.on,html.dark-theme .pg-num.active{background:#4967c8;border-color:#4967c8;color:#fff}
html.dark-theme th,html.dark-theme .filter-panel{background:#202e41}
html.dark-theme tr:hover td{background:#253349}

/* Knowledge library, create folder dialog, and file preview. */
html.dark-theme .kb-libs,html.dark-theme .kb-create-foot,html.dark-theme .kqa-controls{background:#202d40}
html.dark-theme .kb-lib,html.dark-theme .kb-btn{background:var(--card);border-color:var(--border);color:var(--text2)}
html.dark-theme .kb-lib.active,html.dark-theme .kb-btn.primary{background:#4967c8;border-color:#4967c8;color:#fff}
html.dark-theme .kb-ai-qa-link:hover,html.dark-theme .kb-btn.primary:hover{background:#5874d0;border-color:#5874d0;color:#fff}
html.dark-theme .kb-row:hover{background:#253349}
html.dark-theme .kb-btn.danger{color:var(--red);border-color:#68414a}
html.dark-theme .kb-btn.danger:hover{background:var(--red-bg)}
html.dark-theme .kb-create-mask,html.dark-theme .pv-mask{background:rgba(4,9,18,.7)}
html.dark-theme .kb-create-dialog,html.dark-theme .pv-drawer{background:var(--card);border:1px solid var(--border)}
html.dark-theme .kb-create-title,html.dark-theme .kb-create-label{color:var(--text)}
html.dark-theme .kb-create-location{background:#253349;color:var(--text2)}
html.dark-theme .kb-create-input{background:#182436;border-color:var(--border);color:var(--text)}
html.dark-theme .kb-create-input::placeholder{color:var(--text3)}
html.dark-theme .kb-create-input:hover{border-color:var(--border-s)}
html.dark-theme .kb-create-x:hover{background:#2a394e}
html.dark-theme .kb-create-foot{border-color:var(--border)}
html.dark-theme .pv-table th,html.dark-theme .pv-html th{background:#253349;color:var(--text2)}
html.dark-theme .pv-html th,html.dark-theme .pv-html td{border-color:var(--border)}

/* Embedded knowledge Q&A. */
html.dark-theme .kqa-controls{border-color:var(--border)}
html.dark-theme .kqa-select,html.dark-theme .kqa-dd,html.dark-theme .kqa-foot,html.dark-theme .kqa-msg.is-assistant .kqa-bubble{background:var(--card);border-color:var(--border);color:var(--text)}
html.dark-theme .kqa-dd-item:hover,html.dark-theme .kqa-dd-item.active{background:var(--brand-weak);color:var(--brand-strong)}
html.dark-theme .kqa-messages{background:var(--bg)}
html.dark-theme .kqa-msg.is-user .kqa-bubble,html.dark-theme .kqa-send{background:linear-gradient(135deg,#4158b3,#536bc6)}
html.dark-theme .kqa-source{background:#223148;border-color:var(--border)}
html.dark-theme .kqa-sources{border-color:var(--border)}
html.dark-theme .kqa-textarea{background:#182436;border-color:var(--border)}
</style>
</head>
<body>
<div id="app" class="layout"></div>

<script>
/* ============ 内联 SVG 线性图标 ============ */
const ICONS={
  home:'<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/>',

  T.points.logRecords=rng(34).map(i=>({id:'PT'+(100000+i*11),user:randName(),action:pick(['购物获得','签到奖励','下单赠送','兑换扣减','活动奖励','退款扣回']),delta:(Math.random()>0.15?'+':'-')+Math.floor(Math.random()*800+20),time:dateStr(Math.floor(Math.random()*14))}));

<script>
/* ============ 应用逻辑 ============ */
const app=document.getElementById('app');
const state={route:'home',collapsed:{1:false},density:'comfort',sidebarFold:false,kb:{library:'product',path:'',data:null,newFolderOpen:false}};
// 嵌入模式：主壳侧边栏接管导航时，iframe 隐藏自身侧边栏并监听父壳 route 消息。
// URL 形如 /ecommerce-dashboard.html?sb=0
const EMBEDDED=(function(){ try{ return new URLSearchParams(location.search).get('sb')==='0'; }catch(_e){ return false; } })();

// 父壳驱动/同步路由：主壳点击菜单 → ecom-set-route；内部菜单切换 → 回传 ecom-route-change
function _applyParentRoute(route){
  if(!route) return;
  if(route==='knowledge-qa'){
    try{ if(window.parent&&window.parent!==window&&window.parent.postMessage) window.parent.postMessage({type:'ecom-knowledge-qa-open'},'*'); }catch(_e){}
    return;
  }
  state.route=route;
  const keep={1:true};const pid=parentOfRoute(route);if(pid!=null)keep[pid]=true;
  state.collapsed=keep;
  renderAll();
}
function _notifyRouteChange(route){
  if(!EMBEDDED) return;
  try{ if(window.parent&&window.parent!==window&&window.parent.postMessage) window.parent.postMessage({type:'ecom-route-change',route:route},'*'); }catch(_e){}
}
// 知识库 key -> 中文名（与后端 ecom_knowledge_service.LIBRARIES 一致）
const LIB_STATIC={rules:'公司规章制度',product:'产品知识库',design:'设计知识库',support:'客服知识库',operation:'运营知识库',warehouse:'仓库知识库',anchor:'直播知识库',finance:'财务知识库',hr:'人力知识库'};
function LIB_NAME(key){ return LIB_STATIC[key]||key||'知识管理'; }
// 文件删除权限：仅 sys_user.role 为 boss/admin 的用户可在「电商中台 / 公司首页 / 知识管理」删除文件。
// 前端按 localStorage 里登录时写入的 auth_role 隐藏删除入口；后端 /api/ecom-knowledge/delete 再做权威校验。
let _authRole='';
try{ _authRole=String(localStorage.getItem('auth_role')||''); }catch(_e){}
const CAN_DELETE=['boss','admin'].includes(_authRole.toLowerCase());
function fmtSize(n){ n=Number(n)||0; if(n<1024)return n+' B'; if(n<1048576)return (n/1024).toFixed(1)+' KB'; return (n/1048576).toFixed(1)+' MB'; }
const TABLE=TABLES;

// 企业版弹窗：iframe 内把 alert/confirm 通过 postMessage 抛给父层，
// 父层用 Element Plus ElMessageBox 渲染。若父层未挂载（极端降级），再退回到浏览器原生 UI。
let _ecomMsgId=0; const _ecomPending={};
function _ecomInitDialogChannel(){
  if(_ecomInitDialogChannel._done) return;
  _ecomInitDialogChannel._done=true;
  window.addEventListener('message',function(ev){
    const m=ev&&ev.data; if(!m||typeof m!=='object') return;
    if(m.type==='ecom-dialog-result'&&_ecomPending[m.id]){
      const p=_ecomPending[m.id]; delete _ecomPending[m.id];
      try{p.resolve(!!m.ok);}catch(_e){}
    }
  });
}
function ecomAlert(message,title){
  _ecomInitDialogChannel();
  const id=++_ecomMsgId;
  return new Promise(function(resolve){
    let settled=false;
    function settle(){ if(settled) return; settled=true; delete _ecomPending[id]; resolve(); }
    _ecomPending[id]={ resolve:function(){ settle(); } };
    try{
      if(window.parent && window.parent!==window && window.parent.postMessage){
        window.parent.postMessage({type:'ecom-alert',id:id,message:String(message||''),title:String(title||'提示')},'*');
        // 父层未响应（极端情况，例如未挂载监听）时静默跳过，绝不再弹浏览器原生 alert 与企业版弹窗叠加
        setTimeout(function(){ if(_ecomPending[id]) settle(); }, 30000);
      }else{
        // 不在 iframe 中：降级为浏览器原生弹窗
        try{if(typeof alert==='function')alert(message);}catch(_e){} settle();
      }
    }catch(_e){ settle(); }
  });
}
function ecomConfirm(message,title){
  _ecomInitDialogChannel();
  const id=++_ecomMsgId;
  return new Promise(function(resolve){
    let settled=false;
    function settle(ok){ if(settled) return; settled=true; delete _ecomPending[id]; resolve(ok); }
    _ecomPending[id]={ resolve:function(ok){ settle(!!ok); } };
    try{
      if(window.parent && window.parent!==window && window.parent.postMessage){
        window.parent.postMessage({type:'ecom-confirm',id:id,message:String(message||''),title:String(title||'确认')},'*');
        // 30s 内未响应视为取消（不弹浏览器原生 confirm，避免与企业版弹窗叠加）
        setTimeout(function(){ if(_ecomPending[id]) settle(false); }, 30000);
      }else{
        // 不在 iframe 中：降级为浏览器原生 confirm
        try{ settle(typeof confirm==='function'?!!confirm(message):true); }catch(_e){ settle(true); }
      }
    }catch(_e){ settle(true); }
  });
}

function avatar(name,size){return '<span class="avatar" style="width:'+(size||24)+'px;height:'+(size||24)+'px;background:'+avatarColor(name||'?')+';font-size:'+(size||24)*0.44+'px">'+(name||'?').slice(0,1).toUpperCase()+'</span>'}
function tag(text){const t=String(text);let c='blue';if(/完成|解决|已结|充足|正常|成功|热卖|支付|在职|已退款|已上架|上线/.test(t))c='green';else if(/进行|处理|发货|审核|直播|筹备|待审/.test(t))c='blue';else if(/高|急|缺货|警告|滞销|差异|超期|过期|驳回|取消|失败|异常/.test(t))c='orange';else if(/中|低|待|未|普通|一般/.test(t))c='gray';else if(/钻石|黄金|铂金|白银|热|禁用/.test(t))c='purple';return '<span class="tag t-'+c+'">'+text+'</span>'}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function cellHtml(col,row,ri){
  const v=row[col.f];

    case 'image':return '<span class="thumb" style="background:'+palette[(ri||0)%5]+'"></span>';

    case 'tag':return tag(v);
    case 'platform':return '<span>'+esc(v)+'</span>';
    case 'amount':return '<span class="cell num">¥'+esc(v)+'</span>';

}

/* ---- 表格状态（按 main 页缓存）---- */
const tableState={};
function getTState(main){

/* ---- 渲染 ---- */
// 导航分组规划（按业务归组），用一级菜单 label 匹配
const MENU_GROUPS=[
  {title:'总览',labels:['公司首页','数据洞察']},
  {title:'业务',labels:['设计部','运营部','客服部','主播']},
  {title:'供应链',labels:['仓库部']},
  {title:'职能',labels:['财务','人力资源','积分系统']},
];
function menuGroupTitleOf(m){
  for(const g of MENU_GROUPS){if(g.labels.includes(m.label))return g.title}
  return null;
}
// 渲染单个菜单项（一级）
function renderMenuItem(m){
  const hasKids=m.children&&m.children.length;
  const fold=state.sidebarFold;
  if(!hasKids){
    return '<div class="menu-item'+(state.route===m.route?' active':'')+'" data-route="'+m.route+'"><span class="menu-icon">'+icon(m.icon,17)+'</span><span class="menu-label">'+esc(m.label)+'</span></div>';
  }
  const hasActive=hasKids&&m.children.some(c=>c.route===state.route);
  const open=!!state.collapsed[m.id];
  if(fold){
    // 收起态：点击部门图标直接进入该部门主页面（首个子菜单 route）
    const mainRoute=m.children[0].route||m.route;
    const active=(state.route===mainRoute)||hasActive;
    return '<div class="menu-item'+(active?' active':'')+'" data-route="'+mainRoute+'" title="'+esc(m.label)+'"><span class="menu-icon">'+icon(m.icon,17)+'</span></div>';
  }
  let core='<div class="menu-item group-head'+(hasActive?' child-active':'')+'" data-toggle="'+m.id+'"><span class="menu-icon">'+icon(m.icon,17)+'</span><span class="menu-label">'+esc(m.label)+'</span><span class="chev">'+icon(open?'chevronS':'chevronR',14).replace('<svg','<svg class="chev-icon"')+'</span></div>';
  if(open){
    core+='<div class="menu-children">'+m.children.map(c=>{
      const active=state.route===c.route;
      const kindAttr = c.kind ? ' data-kind="'+esc(c.kind)+'"' : '';
      return '<div class="menu-item child'+(active?' active':'')+'" data-route="'+c.route+'"'+kindAttr+'><span class="menu-label">'+esc(c.label)+'</span></div>';
    }).join('')+'</div>';
  }
  return core;
}
function renderMenu(){
  const fold=state.sidebarFold;
  const html=MENUS.map(m=>{
    // 收起态：只保留一级图标，隐藏分组标题与子菜单
    if(fold){
      return renderMenuItem(m);
    }
    const gt=menuGroupTitleOf(m);
    const head = gt ? '<div class="menu-group-title">'+esc(gt)+'</div>' : '';
    return head + renderMenuItem(m);
  }).join('');
  return '<div class="logo"><div class="logo-mark">'+icon('grid',18)+'</div><span class="logo-text">电商中台</span>'
      +'<button class="fold-btn" type="button" title="'+(fold?'展开导航':'收起导航')+'" data-fold>'+icon(fold?'chevronR':'chevronL',16)+'</button></div>'
    +'<nav class="menu">'+html+'</nav>'
    +'<div class="sidebar-foot"><div class="foot-chip">'+icon('database',15)+' 数据已接入</div></div>';
}
function parentOfRoute(route){for(const m of MENUS){if(m.route===route)return m.id;if(m.children&&m.children.some(c=>c.route===route))return m.id}return null}

function renderSidebar(){
  const sb=document.querySelector('.sidebar');
  if(sb){
    sb.classList.toggle('fold', !!state.sidebarFold);
    sb.innerHTML=renderMenu();

  bindMenuEvents();
}
function bindMenuEvents(){
  document.querySelectorAll('[data-route]').forEach(el=>el.addEventListener('click',()=>{
    const route=el.dataset.route;
    if(route==='knowledge-qa'){
      if(window.parent && window.parent!==window && window.parent.postMessage){
        window.parent.postMessage({type:'ecom-knowledge-qa-open'},'*');
      }
      return;
    }
    // 外部模块（AI 项目进度看板 / 库存分析决策 / 简历筛选 / 简历跟进）：
    // 不在这里渲染，而是通知父层 App.vue 切换到对应页面
    if(EXTERNAL_MENUS.has(route)){
      if(window.parent && window.parent!==window && window.parent.postMessage){

function renderLinks(){
  const kbPalette=[
    ['#4f6ef7','#eef1fe'],['#2563eb','#eaf2ff'],['#8b5cf6','#f1ecfe'],

function homeNum(value,decimals){
  const n=Number(value);
  return Number.isFinite(n)?n.toLocaleString('zh-CN',{maximumFractionDigits:decimals||0}):'—';
}
function homeMoney(value){
  const n=Number(value);
  if(!Number.isFinite(n))return '—';
  return Math.abs(n)>=100000000?'¥'+homeNum(n/100000000,2)+' 亿':Math.abs(n)>=10000?'¥'+homeNum(n/10000,1)+' 万':'¥'+homeNum(n,2);
}
function renderHomeMetrics(){
  let body='';
  const d=homeInsight.data;
  if(homeInsight.status==='loading') body='<div class="home-empty">正在读取经营数据…</div>';
  else if(homeInsight.status==='login') body='<div class="home-empty"><strong>登录后查看经营摘要</strong>当前会话尚未登录，经营数据未加载。</div>';
  else if(homeInsight.status==='forbidden') body='<div class="home-empty"><strong>当前账号未开通经营数据分析权限</strong>可使用下方已授权的业务页面。</div>';
  else if(homeInsight.status==='error') body='<div class="home-empty"><strong>经营数据暂时无法读取</strong>'+esc(homeInsight.error||'请稍后重试')+'<br><button class="home-action" type="button" data-home-refresh>重新加载 '+icon('arrowR',13)+'</button></div>';
  else if(homeInsight.status==='empty'||!d||!d.summary||!d.summary.row_count) body='<div class="home-empty"><strong>暂无已导入的经营月报</strong>请在“经营数据分析”导入数据后查看本期指标。</div>';
  else{
    const s=d.summary,c=d.coverage||{};
    const cards=[
      ['本期成交金额',homeMoney(s.revenue),'来自已导入的商品日明细'],
      ['成交件数',homeNum(s.quantity),'商品日明细汇总'],
      ['商品访客合计',homeNum(s.visitors),'各商品日访客求和，非独立访客'],
      ['成交客户合计',homeNum(s.customers),'各商品日客户求和，非独立客户']
    ];
    body='<div class="home-metrics">'+cards.map(x=>'<div class="home-metric"><span class="home-metric-label">'+x[0]+'</span><strong class="home-metric-value">'+x[1]+'</strong><span class="home-metric-note">'+x[2]+'</span></div>').join('')+'</div>';
    const missing=Array.isArray(c.missing_dates)?c.missing_dates.length:0;
    const coverage='源报表覆盖 '+homeNum(c.available_days)+' / '+homeNum(c.expected_days)+' 天 · '+homeNum(s.row_count)+' 条商品日明细';
    body+='<div class="home-data-note'+(missing?' warn':'')+'">'+icon(missing?'bell':'database',15)+'<span>'+coverage+(missing?'；缺少 '+missing+' 天源报表，建议先补齐再比较趋势。':'；数据来自运营部已导入的月报。')+'</span></div>';
  }
  const period=homeInsight.end?'<span class="home-period">'+esc(homeInsight.start)+' 至 '+esc(homeInsight.end)+'</span>':'';
  return '<section class="card home-panel" aria-label="经营摘要"><div class="home-section-head"><div><h2>经营摘要</h2><p>默认展示最近有数据月份的月初至最新数据日；指标与经营总览口径一致。</p></div>'+period+'</div>'+body+'</section>';
}

function renderHome(){
  return renderLinks()+renderHomeMetrics()+renderHomeEntries();
}
async function loadHomeInsight(){
  const requestId=++homeInsightVersion;
  if(EMBEDDED&&homeAllowedRoutes&&!homeAllowedRoutes.has('operating-analysis')){
    homeInsight.status='forbidden';homeInsight.data=null;homeInsight.start='';homeInsight.end='';if(state.route==='home')renderAll();return;
  }
  homeInsight.status='loading';homeInsight.error='';homeInsight.start='';homeInsight.end='';if(state.route==='home')renderAll();
  try{
    const metadataResponse=await fetch('/api/operating-analysis/metadata',{credentials:'same-origin',cache:'no-store'});
    if(requestId!==homeInsightVersion)return;
    if(metadataResponse.status===401){homeInsight.status='login';return;}
    if(metadataResponse.status===403){homeInsight.status='forbidden';return;}
    if(!metadataResponse.ok)throw new Error('数据源连接失败（'+metadataResponse.status+'）');
    const metadata=await metadataResponse.json();
    const dates=Array.isArray(metadata.dates)?metadata.dates:[];
    if(!dates.length){homeInsight.status='empty';homeInsight.data=null;return;}
    const latest=String(dates[dates.length-1]);
    const start=latest.slice(0,7)+'-01';
    const query=new URLSearchParams({start:start,end:latest});
    const response=await fetch('/api/operating-analysis/insights?'+query,{credentials:'same-origin',cache:'no-store'});
    if(requestId!==homeInsightVersion)return;
    if(response.status===403){homeInsight.status='forbidden';return;}
    if(!response.ok)throw new Error('经营摘要读取失败（'+response.status+'）');
    homeInsight.data=await response.json();homeInsight.start=start;homeInsight.end=latest;homeInsight.status='ready';
  }catch(error){if(requestId===homeInsightVersion){homeInsight.status='error';homeInsight.data=null;homeInsight.error=error&&error.message?error.message:'请稍后重试';}}
  finally{if(requestId===homeInsightVersion&&state.route==='home')renderAll();}
}

function findSubTree(tree, dirArr){
  let nodes=tree||[];
  for(const seg of dirArr||[]){
    const f=nodes.find(n=>n.type==='folder'&&n.name===seg);
    if(f&&f.children) nodes=f.children; else return [];
  }
  return nodes;
}

async function submitNewKnowledgeFolder(lib){
  const input=document.querySelector('[data-kb-newfolder-input]');
  const submit=document.querySelector('[data-kb-mkdir]');
  const name=(input&&input.value||'').trim();
  if(!name){ setNewFolderError('请输入文件夹名称'); if(input)input.focus(); return; }
  if(name==='.'||name==='..'){ setNewFolderError('请输入有效的文件夹名称'); if(input)input.focus(); return; }
  if(/[\\/:*?"<>|]/.test(name)){ setNewFolderError('名称中包含不支持的特殊字符'); if(input)input.focus(); return; }
  const currentNodes=state.kb.data?findSubTree(state.kb.data.tree||[],state.kb.dir||[]):[];
  if(currentNodes.some(n=>n.type==='folder'&&String(n.name||'').toLowerCase()===name.toLowerCase())){
    setNewFolderError('当前目录已存在同名文件夹'); if(input)input.focus(); return;
  }
  setNewFolderError('');
  if(input) input.disabled=true;
  if(submit){ submit.disabled=true; submit.textContent='创建中…'; }
  try{
    const response=await fetch('/api/ecom-knowledge/folder',{
      method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({library:lib,path:(state.kb.dir||[]).concat([name]).join('/')})
    });
    if(!response.ok){
      let detail='';
      try{ const data=await response.json(); detail=String(data&&data.detail||''); }catch(_e){}
      throw new Error(detail.replace(/^新建知识库文件夹失败:\s*/,'')||'创建失败，请稍后重试');
    }
    state.kb.newFolderOpen=false;
    loadKnowledge();
  }catch(err){
    if(input) input.disabled=false;
    if(submit){ submit.disabled=false; submit.textContent='创建文件夹'; }
    setNewFolderError(err&&err.message?err.message:'创建失败，请检查网络后重试');
    if(input) input.focus();
  }
}

function uploadFiles(files,lib){
  if(!files||!files.length)return;
  const fd=new FormData();
  fd.append('library',lib);
  fd.append('folder',(state.kb.dir||[]).join('/'));
  for(const f of Array.from(files)) fd.append('file',f);
  fetch('/api/ecom-knowledge/upload',{method:'POST',body:fd,credentials:'same-origin'}).then(r=>{ loadKnowledge(); const fi=document.querySelector('[data-kb-fileinput]'); if(fi)fi.value=''; }).catch(()=>{});
}

function bindKnowledgeQAEvents(){
  // 首次进入时加载库列表
  if(!Object.keys(KQA.libraries).length) kqaLoadLibraries();
  if(!bindKnowledgeQAEvents._docBound){
    document.addEventListener('click',kqaGlobalDocClick);

  }

  const selBox=document.querySelector('[data-kqa-select]');
  const dd=document.querySelector('[data-kqa-dd-root]');

    function closeDd(){ dd.hidden=true; selBox.classList.remove('open'); }
    function openDd(){ dd.hidden=false; selBox.classList.add('open'); }
    selBox.addEventListener('click',(e)=>{
      e.stopPropagation();
      if(dd.hidden) openDd(); else closeDd();

    function growTextarea(){
      ta.style.height='auto';
      ta.style.height=Math.min(ta.scrollHeight,140)+'px';

    ta.value=KQA.input||'';

async function kqaSend(){
  if(KQA.pending) return;
  const q=(KQA.input||'').trim();
  if(!q) return;
  KQA.messages.push({id:KQA.nextId++,role:'user',content:q});
  KQA.input='';
  KQA.pending=true;
  renderAll();
  const targets=KQA.library?[KQA.library]:Object.keys(KQA.libraries);
  const errors=[];
  let primaryAnswer='',primarySources=[],primaryModel='';
  for(const lib of targets){
    try{
      const r=await fetch('/api/ecom-knowledge/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({library:lib,question:q,top_k:4}),credentials:'same-origin'});
      if(!r.ok) throw new Error('HTTP '+r.status);
      const d=await r.json();
      if(!primaryAnswer && d && d.answer){ primaryAnswer=d.answer; primarySources=d.sources||[]; primaryModel=d.model||''; }
      else if(d && d.sources && d.sources.length){
        const seen=new Set(primarySources.map(s=>s.path+':'+s.chunk_id));
        for(const s of d.sources){ const k=s.path+':'+s.chunk_id; if(!seen.has(k)){ primarySources.push(s); seen.add(k); } }
      }
    }catch(err){ errors.push((KQA.libraries[lib]||lib)+': '+(err && err.message ? err.message : '请求失败')); }
  }
  KQA.pending=false;
  if(!primaryAnswer && errors.length){
    KQA.messages.push({id:KQA.nextId++,role:'assistant',content:'抱歉，问答请求失败：\n'+errors.join('\n'),sources:[]});
  }else if(!primaryAnswer){
    KQA.messages.push({id:KQA.nextId++,role:'assistant',content:'暂无匹配内容。可以换个说法，或者先到「知识管理」上传相关文档。',sources:[]});
  }else{
    KQA.messages.push({id:KQA.nextId++,role:'assistant',content:primaryAnswer,sources:primarySources,model:primaryModel});
  }
  renderAll();
}

function bindLinks(){
  document.querySelectorAll('[data-target]').forEach(el=>el.addEventListener('click',()=>{
    const route=el.dataset.target;
    if(EXTERNAL_MENUS.has(route)){
      if(window.parent&&window.parent!==window) window.parent.postMessage({type:'ecom-external-open',menu:route},'*');
      else location.href='/?menu='+encodeURIComponent(route);
      return;
    }
    state.route=route;state.collapsed={};renderAll();
  }));
}

function renderKpis(page){
  const cards=(KPIS[page]||[]).map(c=>{
    const hint=c[4]==='up'?icon('chevronR',12):c[4]==='down'?icon('chevronL',12):'';
    return '<div class="card kpi-card"><div class="kpi-top"><span class="kpi-label">'+esc(c[0])+'</span><span class="kpi-color c-'+c[5]+'"></span></div><div class="kpi-value">'+esc(c[1])+'<span class="kpi-unit">'+esc(c[2])+'</span></div><div class="kpi-hint '+(c[4])+'">'+hint+' '+esc(c[3])+'</div></div>';
  }).join('');
  return '<div class="kpi-grid">'+cards+'</div>';
}

function renderTable(main){
  const def=TABLE[main];
  if(!def)return '<div class="card err-box">页面数据未定义</div>';
  const st=getTState(main);
  // 统一数据取用：优先按当前 tab 从后端 tabData 取；无 tabData（mock 兜底）用 def.cols/records
  const firstKey=(def.tabs&&def.tabs[0]&&def.tabs[0].key)||'main';
  const cur=def.tabData?(def.tabData[st.tab]||def.tabData[firstKey]||null):null;
  let cols=cur?cur.cols:(def.cols||[]);
  let base=cur?cur.records:(def.records||[]);
  // 兼容老 mock：points 的 logRecords 特判
  if(!cur && def.logRecords && st.tab==='log'){
    cols=[{f:'id',l:'流水号',t:'text',w:130},{f:'user',l:'用户',t:'user',w:140},{f:'action',l:'动作',t:'text',w:160},{f:'delta',l:'积分变动',t:'text',w:110},{f:'time',l:'时间',t:'date',w:160},{f:'ck',l:'',t:'checkbox',w:44}];
    base=def.logRecords||[];
  }

  // 搜索 + 筛选
  let rows=base.filter(r=>{
    const q=st.search.toLowerCase();
    if(q&&!Object.values(r).some(v=>String(v).toLowerCase().includes(q)))return false;
    if(st.filter&&!Object.values(r).some(v=>String(v)===st.filter))return false;
    return true;
  });
  // 排序
  if(st.sortF){const f=st.sortF;rows=rows.slice().sort((a,b)=>{const an=Number(a[f]),bn=Number(b[f]);const cmp=(!isNaN(an)&&!isNaN(bn))?an-bn:String(a[f]||'').localeCompare(String(b[f]||''),'zh');return st.sortD==='desc'?-cmp:cmp})}

  const total=rows.length;
  const pages=Math.max(1,Math.ceil(total/st.size));
  const pg=Math.min(st.page,pages);
  const slice=rows.slice((pg-1)*st.size,pg*st.size);

  const tabsHtml='<div class="tabs">'+def.tabs.map(t=>'<button class="tab'+(t.key===st.tab?' active':'')+'" data-tab="'+t.key+'">'+t.label+'</button>').join('')+'</div>';
  const sortIcon=f=>st.sortF===f?icon(st.sortD==='asc'?'chevronS':'chevronR',12).replace('<svg','<svg class="sort-ic"'):'';
  const ths=cols.map(c=>'<th style="width:'+c.w+'px"><span class="th-sort" data-sort="'+c.f+'">'+esc(c.l)+sortIcon(c.f)+'</span></th>').join('');
  const body=slice.length?slice.map((r,i)=>'<tr>'+cols.map(c=>'<td class="cell">'+cellHtml(c,r,i)+'</td>').join('')+'</tr>').join('')
    :'<tr><td colspan="'+cols.length+'"><div class="empty"><div class="empty-icon">'+icon('database',36)+'</div><p class="empty-text">暂无数据</p></div></td></tr>';

  // 筛选面板（tag 列）
  const tagCol=cols.find(c=>c.t=== 'tag'&& c.f!=='conversion');
  let filterPanel='';
  if(st.filterOpen&&tagCol){
    const vals=[...new Set(base.map(r=>r[tagCol.f]))];
    filterPanel='<div class="filter-panel"><span class="fp-label">筛选：'+esc(tagCol.l)+'</span>'+vals.map(v=>'<button class="fp-chip'+(st.filter===v?' on':'')+'" data-fv="'+esc(v)+'">'+esc(v)+'</button>').join('')+'<button class="fp-clear">清除</button></div>';
  }

  // 分页
  const pageBtns='<button class="pg-btn" data-pg="'+(pg-1)+'" '+(pg<=1?'disabled':'')+'">'+icon('chevronL',14)+'</button>'+Array.from({length:pages},(_,i)=>'<button class="pg-num'+(i+1===pg?' active':'')+'" data-pg="'+(i+1)+'">'+(i+1)+'</button>').join('')+'<button class="pg-btn" data-pg="'+(pg+1)+'" '+(pg>=pages?'disabled':'')+'">'+icon('chevronR',14)+'</button>';

  return '<section class="card table-card">'
    +'<div class="table-head"><div class="head-title"><h3 class="section-title">'+esc(MAIN_TITLES[main])+'</h3>'+tabsHtml+'</div>'
    +'<div class="toolbar">'
    +'<div class="tool search">'+icon('search',15)+'<input type="text" placeholder="搜索" data-search value="'+esc(st.search)+'"></div>'
    +'<button class="tool-btn'+(st.filterOpen?' on':'')+'" data-filter>'+icon('filter',15)+'<span>筛选</span></button>'
    +'<button class="tool-btn" data-sortbtn>'+icon('sort',15)+'<span>排序</span></button>'
    +'<button class="tool-btn" data-density>'+icon('height',15)+'<span>行高</span></button>'
    +'</div></div>'
    +filterPanel
    +'<div class="table-wrap"><table class="'+st.density+'"><thead><tr>'+ths+'</tr></thead><tbody>'+body+'</tbody></table></div>'
    +'<div class="pagination"><span class="total">共 '+total+' 条</span><div class="pages">'+pageBtns+'</div><div class="page-right"><label class="size-label">每页<select data-size><option '+(st.size===10?'selected':'')+'>10</option><option '+(st.size===20?'selected':'')+'>20</option><option '+(st.size===50?'selected':'')+'>50</option></select>条</label><label class="jump">跳至<input type="number" data-jump min="1" max="'+pages+'"><span>/ '+pages+' 页</span></label></div></div>'
    +'</section>';
}

function renderAll(){
  const KN=state.route==='knowledge';
  const main=KN?('knowledge'):(ROUTE_TO_MAIN[state.route]||'home');
  const title=KN?(LIB_NAME(state.kb&&state.kb.library)||'知识管理'):(MAIN_TITLES[main]||'公司首页');
  // 面包屑：电商中台 / 公司首页 / 部门名（公司首页可点击返回首页）
  // 首页路由用「经营看板首页」命名（与主壳侧边栏子项一致）
  let deptCrumb, hrefCrumb;
  if(KN){
    hrefCrumb=' / <a href="#" class="crumb" data-crumb="knowledge">知识管理</a>';
    deptCrumb='';
  }else{
    hrefCrumb='';
    deptCrumb = main==='home'
      ? ''
      : ' / <a href="#" class="crumb" data-crumb="'+state.route+'">'+esc(title)+'</a>';
  }
  const homeCrumbLabel = main==='home' ? '经营看板首页' : '公司首页';
  const breadcrumb='<span class="breadcrumb">电商中台 / <a href="#" class="crumb" data-crumb="home">'+homeCrumbLabel+'</a>'+hrefCrumb+deptCrumb+'</span>';
  const isDevRoute=!KN && main!=='home' && main!=='knowledge-qa' && TEST_ROUTES.has(state.route);
  let content='';
  if(KN){
    content='<div class="kb-page block">'+renderKnowledge()+'</div>';
  }else if(main==='home'){
    content='<div class="page block">'+renderHome()+'</div>';
  }else if(main==='knowledge-qa'){
    content='<div class="page block kqa-page">'+renderKnowledgeQA()+'</div>';
  }else{
    content='<div class="page block"><div class="block">'+renderKpis(main)+'</div><div class="block">'+renderTable(main)+'</div></div>';
  }
  const topbarClass=isDevRoute?'topbar topbar-dev':'topbar';
  if(EMBEDDED){
    // 嵌入模式：主壳侧边栏接管导航，本页只渲染内容区
    app.className='layout embedded';
    app.innerHTML='<main class="main"><header class="'+topbarClass+'"><div class="topbar-left">'+breadcrumb+'</div><div class="topbar-right"><button class="icon-btn" type="button" title="刷新当前页" aria-label="刷新当前页" data-page-refresh>'+icon('refresh',17)+'</button></div></header><div class="content" id="content">'+content+'</div></main>';
  }else{
    app.className='layout';
    app.innerHTML='<aside class="sidebar'+(state.sidebarFold?' fold':'')+'"></aside>'
      +'<main class="main"><header class="'+topbarClass+'"><div class="topbar-left">'+breadcrumb+'</div><div class="topbar-right"><button class="icon-btn" type="button" title="刷新当前页" aria-label="刷新当前页" data-page-refresh>'+icon('refresh',17)+'</button></div></header><div class="content" id="content">'+content+'</div></main>';
    renderSidebar();
  }
  bindContentEvents(KN?'knowledge':main);
  if(main==='knowledge-qa') bindKnowledgeQAEvents();
}

function bindContentEvents(main){
  document.querySelectorAll('[data-page-refresh]').forEach(el=>el.addEventListener('click',()=>{if(main==='home')loadHomeInsight();else if(main==='knowledge')loadKnowledge();else loadRemote();}));
  // 面包屑：点击可返回首页 / 跳到部门
  document.querySelectorAll('[data-crumb]').forEach(el=>el.addEventListener('click',e=>{
    e.preventDefault();
    const target=el.dataset.crumb;
    state.route=target;
    const keep={1:true};const pid=parentOfRoute(target);if(pid!=null)keep[pid]=true;
    state.collapsed=keep;
    renderAll();
    _notifyRouteChange(state.route);
  }));
  // 知识管理页交互
  if(main==='knowledge'){ bindKnowledgeEvents(); return; }
  document.querySelectorAll('[data-home-refresh]').forEach(el=>el.addEventListener('click',loadHomeInsight));
  // 快捷入口
  document.querySelectorAll('[data-target]').forEach(el=>el.addEventListener('click',()=>{
    const route=el.dataset.target;
    if(EXTERNAL_MENUS.has(route)){
      if(window.parent&&window.parent!==window) window.parent.postMessage({type:'ecom-external-open',menu:route},'*');
      else location.href='/?menu='+encodeURIComponent(route);
      return;
    }
    state.route=route;
    const keep={1:true};const pid=parentOfRoute(state.route);if(pid!=null)keep[pid]=true;
    state.collapsed=keep;renderAll();
    _notifyRouteChange(state.route);
  }));
  // 知识管理入口：跳转到对应知识库页
  document.querySelectorAll('[data-kb]').forEach(el=>el.addEventListener('click',()=>{
    const name=el.dataset.kb;
    // 中文名 -> key
    let lib=null;
    for(const k of Object.keys(LIB_STATIC)){ if(LIB_STATIC[k]===name){ lib=k; break; } }
    if(!lib) lib='rules';
    state.route='knowledge';
    state.kb.library=lib; state.kb.dir=[]; state.kb.data=null;
    loadKnowledge();
  }));
  // 首页主操作：进入主壳中的 AI 知识问答，和侧边栏入口保持一致。
  document.querySelectorAll('[data-kb-ai-home]').forEach(btn=>btn.addEventListener('click',()=>{
    if(window.parent && window.parent!==window && window.parent.postMessage){
      window.parent.postMessage({type:'ecom-knowledge-qa-open'},'*');
      return;
    }
    state.route='knowledge-qa';
    renderAll();
  }));
  // Tab
  document.querySelectorAll('[data-tab]').forEach(el=>el.addEventListener('click',()=>{const st=getTState(main);st.tab=el.dataset.tab;st.page=1;renderAll()}));
  // 搜索
  const s=document.querySelector('[data-search]');if(s)s.addEventListener('keyup',e=>{if(e.key==='Enter'){getTState(main).search=e.target.value;getTState(main).page=1;renderAll()}});
  // 筛选
  const fb=document.querySelector('[data-filter]');if(fb)fb.addEventListener('click',()=>{const st=getTState(main);st.filterOpen=!st.filterOpen;renderAll()});
  document.querySelectorAll('[data-fv]').forEach(el=>el.addEventListener('click',()=>{const st=getTState(main);st.filter=st.filter===el.dataset.fv?'':el.dataset.fv;st.page=1;renderAll()}));
  const fc=document.querySelector('.fp-clear');if(fc)fc.addEventListener('click',()=>{const st=getTState(main);st.filter='';st.filterOpen=false;renderAll()});
  // 排序按钮/列头
  const sb=document.querySelector('[data-sortbtn]');if(sb)sb.addEventListener('click',()=>{const st=getTState(main);const c=(TABLE[main].cols[0]||{}).f||'id';st.sortF=st.sortF===c?c:(TABLE[main].cols[1]||{}).f||c;st.sortD=st.sortD==='asc'?'desc':'asc';renderAll()});
  document.querySelectorAll('[data-sort]').forEach(el=>el.addEventListener('click',()=>{const st=getTState(main);const f=el.dataset.sort;if(st.sortF===f)st.sortD=st.sortD==='asc'?'desc':'asc';else{st.sortF=f;st.sortD='asc'}renderAll()}));
  // 行高
  const d=document.querySelector('[data-density]');if(d)d.addEventListener('click',()=>{const st=getTState(main);st.density=st.density==='comfort'?'compact':'comfort';renderAll()});
  // 分页
  document.querySelectorAll('[data-pg]').forEach(el=>el.addEventListener('click',e=>{if(el.disabled)return;const st=getTState(main);st.page=parseInt(el.dataset.pg,10);if(!st.page||st.page<1)st.page=1;renderAll()}));
  const sz=document.querySelector('[data-size]');if(sz)sz.addEventListener('change',e=>{const st=getTState(main);st.size=parseInt(e.target.value,10);st.page=1;renderAll()});
  const jp=document.querySelector('[data-jump]');if(jp)jp.addEventListener('keyup',e=>{if(e.key==='Enter'){const st=getTState(main);const def=TABLE[main];const firstKey=(def.tabs&&def.tabs[0]&&def.tabs[0].key)||'main';const cur=def.tabData?(def.tabData[st.tab]||def.tabData[firstKey]||null):null;let base=cur?cur.records:(def.logRecords&&st.tab==='log'?def.logRecords:(def.records||[]));let n=base.filter(r=>{const q=st.search.toLowerCase();if(q&&!Object.values(r).some(v=>String(v).toLowerCase().includes(q)))return false;if(st.filter&&!Object.values(r).some(v=>String(v)===st.filter))return false;return true}).length;const v=parseInt(e.target.value,10);const pages=Math.max(1,Math.ceil(n/st.size));if(v>=1&&v<=pages){st.page=v;renderAll()}}});
}

/* ---- 后端数据接通：把 /api/dashboard/ecom 返回的 JSON 转成前端数据格式 ---- */
function normalizeMenus(apiMenus){
  let seed=0;
  function walk(nodes){
    return (nodes||[]).map(n=>{ seed+=1; const node={id:seed,label:n.label,icon:n.icon||'',route:n.route||''}; if(n.children&&n.children.length)node.children=walk(n.children); return node; });
  }
  return walk(apiMenus);
}
function normalizeKpis(apiKpis){
  const out={};
  for(const page of Object.keys(apiKpis||{})){
    out[page]=(apiKpis[page]||[]).map(k=>[k.label||'',k.value!==undefined&&k.value!==null?String(k.value):'',k.unit||'',k.hint||'',k.trend||'flat',k.color||'blue']);
  }
  return out;
}
// 保证「公司首页」分组下始终有「AI 知识问答」入口。
// 后端菜单数据（MySQL/种子）如果缺了这个子项就会被 loadRemote 覆盖丢档，
// 导致侧边栏下拉里再也看不到「AI 知识问答」，也就无法打开该页面。
function ensureKnowledgeQaEntry(menus){
  const home=(menus||[]).find(m=>m.route==='home');
  if(home){
    if(!Array.isArray(home.children)) home.children=[];
    const has=home.children.some(c=>c.route==='knowledge-qa');
    if(!has) home.children.push({id:999001,label:'AI 知识问答',route:'knowledge-qa',kind:'knowledge-qa'});
  }
  return menus;
}
function normalizeMenus(apiMenus){
  let seed=0;
  function walk(nodes){
    return (nodes||[]).map(n=>{ seed+=1; const node={id:seed,label:n.label,icon:n.icon||'',route:n.route||''}; if(n.children&&n.children.length)node.children=walk(n.children); return node; });
  }
  return walk(apiMenus);
}
function hydrateFromApi(api){
  if(!api) return false;
  const nm=normalizeMenus(api.menus);
  if(nm&&nm.length) MENUS=ensureKnowledgeQaEntry(nm); else return false;
  const nk=normalizeKpis(api.kpis);
  if(Object.keys(nk).length) KPIS=nk;
  const built={};
  const pages=Object.keys(api.tabs||{});
  for(const page of pages){
    const pageTabs=(api.tabs[page]||[]);
    if(!pageTabs.length) continue;
    built[page]={tabs:pageTabs.map(t=>({key:t.key,label:t.label})), tabData:{}};
    for(const t of pageTabs){
      const ck=page+'|'+t.key;
      const cols=(api.cols&&api.cols[ck])?api.cols[ck].map(c=>({f:c.field,l:c.label,t:c.type||'text',w:c.width||120})):[];
      const records=(api.rows&&api.rows[ck])?api.rows[ck]:[];
      built[page].tabData[t.key]={cols,records};
    }
  }
  if(Object.keys(built).length){
    Object.keys(TABLES).forEach(k=>delete TABLES[k]);
    Object.assign(TABLES,built);
  }
  return true;
}
function loadRemote(){
  fetch('/api/dashboard/ecom',{credentials:'same-origin'})
    .then(res=>res.ok?res.json():Promise.reject(res.status))
    .then(api=>{ if(hydrateFromApi(api)) renderAll(); })
    .catch(()=>{ /* 后端不可用则保留 mock，页面不白屏 */ console.log('电商中台看板：后端数据暂不可用，展示内置演示数据'); });
}

renderAll();      // 首页先展示加载状态；其余模板页沿用现有数据装载方式
loadRemote();
loadHomeInsight();

// 嵌入模式：接收父壳（主壳 App.vue）下发的路由并切换
if(EMBEDDED){
  window.addEventListener('message',function(ev){
    const m=ev&&ev.data; if(!m||typeof m!=='object') return;
    if(m.type==='ecom-set-route'){ _applyParentRoute(m.route); }
    if(m.type==='ecom-permissions'&&Array.isArray(m.routes)){
      homeAllowedRoutes=new Set(m.routes.filter(route=>typeof route==='string'));
      if(state.route==='home')renderAll();
      if(!homeAllowedRoutes.has('operating-analysis')){homeInsightVersion++;homeInsight.status='forbidden';homeInsight.data=null;homeInsight.start='';homeInsight.end='';if(state.route==='home')renderAll();}
      else if(homeInsight.status==='forbidden')loadHomeInsight();
    }
  });
  _notifyRouteChange(state.route);
}
